# Sensei rules — generic (auto-generated by `sensei init`).

[constraints]
max_cc = 15
max_cog = 30
max_lines_per_file = 500

[modularity]
method = "damq"
god_file_threshold = 500

# Metric configuration (v1.1+).
# These settings control formula behavior and escape hatches.
# Omit any section to use defaults.

[metrics.modularity]
# Coupling formula: "density" (default) or "legacy" (v1.0 inverse-count).
# "density" is scale-invariant — better for monorepos with many cross-module edges.
coupling_formula = "density"

[metrics.depth]
# Exclude type-only/barrel/constant files from depth counting.
# These are structural solutions, not architectural defects.
zero_logic_hops = true
# Sigmoid midpoint: depth = 1/(1 + max_depth / midpoint).
# Higher = more lenient. Default: 8.
sigmoid_midpoint = 8

[metrics.fan_out]
# Role-aware god-file detection: orchestrator files (high intra-module ratio)
# are not classified as god files.
role_aware = true
# Minimum intra-module ratio to classify as orchestrator. Default: 0.7.
orchestrator_ratio = 0.7
